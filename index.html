<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Collaboration Portal | BUAN4061</title>
</head>
<body>

<script>
const API_URL = "YOUR_SCRIPT_URL_HERE"; 

let projects = [];

// ------------------- LOAD DATA -------------------
async function loadData() {
    if (!API_URL || API_URL.includes("YOUR_SCRIPT_URL_HERE")) {
        console.warn("API_URL not set.");
        return;
    }

    try {
        const response = await fetch(API_URL);
        const rawData = await response.json();

        projects = rawData.map(p => ({
            id: p.ID,
            leader: p.LeaderName,
            leaderEmail: p.LeaderEmail,
            projectName: p.ProjectName,
            description: p.Description,
            members: JSON.parse(p.MembersJSON || "[]")
        }));

        render();
    } catch (e) {
        console.error("Load error:", e);
    }
}

// ------------------- ADD PROJECT -------------------
async function addProject() {
    const leader = document.getElementById('leaderName').value;
    const email = document.getElementById('leaderEmail').value;
    const name = document.getElementById('projName').value;
    const desc = document.getElementById('projDesc').value;

    if(!leader || !email || !name) {
        alert("Please fill required fields.");
        return;
    }

    try {
        const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "ADD_PROJECT",
                leader, email, name, desc
            })
        });

        console.log(await res.text());

        document.querySelectorAll('input, textarea').forEach(el => el.value = '');
        await loadData();

    } catch (e) {
        console.error("Add error:", e);
    }
}

// ------------------- JOIN PROJECT -------------------
async function joinProject(index) {
    const name = prompt("Enter your full name:");
    if (!name) return;

    const email = prompt("Enter your email:");
    if (!email) return;

    projects[index].members.push({ name, email });

    try {
        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "UPDATE_MEMBERS",
                id: projects[index].id,
                members: projects[index].members
            })
        });

        await loadData();
    } catch (e) {
        console.error("Join error:", e);
    }
}

// ------------------- RENDER -------------------
function render() {
    const tbody = document.querySelector('#projectTable tbody');
    if (!tbody) return;

    tbody.innerHTML = '';

    projects.forEach((p, pIdx) => {
        let memberCells = '';

        for(let i = 0; i < 4; i++) {
            if(p.members[i]) {
                memberCells += `
                    <td>${p.members[i].name}</td>
                `;
            } else {
                memberCells += `
                    <td>
                        <button onclick="joinProject(${pIdx})">Join</button>
                    </td>
                `;
            }
        }

        // ✅ FIXED LINE HERE
        tbody.innerHTML += `
            <tr>
                <td>${p.leader}</td>
                <td>${p.projectName}</td>
                ${memberCells}
            </tr>
        `;
    });
}

// ------------------- INIT -------------------
loadData();
</script>

</body>
</html>
